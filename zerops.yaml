# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/zerops-yaml-json-schema.json
#
# Monorepo pipeline — one file, six app setups.
# import.yaml zeropsSetup names must match these setup: keys.
# Public URLs come from ${hostname_zeropsSubdomain}, which resolves to
# https://{hostname}-{subdomainHost}-{port} with the project's own region
# and declared port. Never hand-build them — a literal region is correct in
# one project and wrong in every other.
#
# The reference is one-directional on purpose: frontend -> api only. The api
# scopes CORS with the project-level ${zeropsSubdomainHost} instead of
# referencing frontend, because mutual service refs cannot both resolve on a
# single-pass import.

zerops:
  # ── frontend (prod) ─────────────────────────────────────────
  # Vite build on Node, Nginx runtime. VITE_* is baked in at build
  # time. ${api_zeropsSubdomain} carries its -3000 suffix only once api
  # has deployed once; on a first launch into an empty project, let api
  # come up first, then re-release frontend.
  - setup: frontend
    build:
      base: ubuntu/nodejs@22
      envVariables:
        VITE_API_URL: ${api_zeropsSubdomain}
        VITE_WORKSHOP_ENV: prod
      buildCommands:
        - npm ci
        - npm run build -w @deck/frontend
      # Strip apps/frontend/dist so index.html is the Nginx root.
      deployFiles:
        - apps/frontend/dist/~
      cache:
        - node_modules
    run:
      base: static

  # ── frontend-dev ────────────────────────────────────────────
  # Full tree + Node so the agent can `npm run dev` over SSH.
  - setup: frontend-dev
    build:
      base: ubuntu/nodejs@22
      envVariables:
        VITE_API_URL: ${apidev_zeropsSubdomain}
        VITE_WORKSHOP_ENV: dev
      buildCommands:
        - npm install
      deployFiles: ./
      cache:
        - node_modules
    run:
      base: ubuntu/nodejs@22
      ports:
        - port: 5173
          httpSupport: true
      envVariables:
        VITE_API_URL: ${apidev_zeropsSubdomain}
        VITE_WORKSHOP_ENV: dev

  # ── api (prod) ──────────────────────────────────────────────
  # REST + WebSocket. Talks to db, queue, and cache by hostname.
  - setup: api
    build:
      base: ubuntu/nodejs@22
      buildCommands:
        - npm ci
      # Workspace packages are linked from the repo root — deploy
      # the tree, not a single app folder.
      deployFiles: ./
      cache:
        - node_modules
    deploy:
      readinessCheck:
        httpGet:
          port: 3000
          path: /health
    run:
      base: ubuntu/nodejs@22
      # One migrator per deploy version. Worker also runs IF NOT
      # EXISTS on boot; execOnce keeps the first-deploy race off
      # the request path.
      initCommands:
        - zsc execOnce ${appVersionId}-api-migrate --retryUntilSuccessful -- npm run migrate -w @deck/api
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        NODE_ENV: production
        PORT: "3000"
        HOST: "::"
        # CORS is scoped by the project's own subdomain host, a project-level
        # value present from project creation. Referencing the frontend
        # service here instead would deadlock: frontend's build needs
        # ${api_zeropsSubdomain}, so api must be created first.
        PROJECT_SUBDOMAIN_HOST: ${zeropsSubdomainHost}
        DATABASE_URL: ${db_connectionString}
        VALKEY_URL: ${cache_connectionString}
        # Discrete NATS fields — nats.js treats extra colons in a
        # connection string as IPv6 and rejects generated passwords.
        NATS_HOST: ${queue_hostname}
        NATS_PORT: ${queue_port}
        NATS_USER: ${queue_user}
        NATS_PASSWORD: ${queue_password}
      start: npm run start -w @deck/api
      healthCheck:
        httpGet:
          port: 3000
          path: /health

  # ── api-dev ─────────────────────────────────────────────────
  - setup: api-dev
    build:
      base: ubuntu/nodejs@22
      buildCommands:
        - npm install
      deployFiles: ./
      cache:
        - node_modules
    run:
      base: ubuntu/nodejs@22
      initCommands:
        - zsc execOnce ${appVersionId}-apidev-migrate --retryUntilSuccessful -- npm run migrate -w @deck/api
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        NODE_ENV: development
        PORT: "3000"
        HOST: "::"
        # Same project-scope CORS host as the prod api — admits the Vite
        # slot and the static SPA alike, in any region.
        PROJECT_SUBDOMAIN_HOST: ${zeropsSubdomainHost}
        DATABASE_URL: ${db_connectionString}
        VALKEY_URL: ${cache_connectionString}
        NATS_HOST: ${queue_hostname}
        NATS_PORT: ${queue_port}
        NATS_USER: ${queue_user}
        NATS_PASSWORD: ${queue_password}

  # ── worker (prod) ───────────────────────────────────────────
  # CPU-bound Chromium. No public HTTP. System packages live in
  # run.prepareCommands — that is why this is a system container.
  - setup: worker
    build:
      base: ubuntu/nodejs@22
      buildCommands:
        - npm ci
      deployFiles: ./
      cache:
        - node_modules
    run:
      base: ubuntu/nodejs@22
      # Ubuntu ships Chromium as a snap and fonts-noto-core only on
      # 24.04 — both 100 apt. Chrome is a real .deb Playwright can launch.
      prepareCommands:
        - sudo apt-get update
        - sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates fonts-liberation fonts-noto
        - curl -fsSL -o /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        - sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends /tmp/chrome.deb
        - rm -f /tmp/chrome.deb
      envVariables:
        NODE_ENV: production
        RENDER_DRIVER: chromium
        CHROMIUM_PATH: /usr/bin/google-chrome-stable
        DATABASE_URL: ${db_connectionString}
        VALKEY_URL: ${cache_connectionString}
        NATS_HOST: ${queue_hostname}
        NATS_PORT: ${queue_port}
        NATS_USER: ${queue_user}
        NATS_PASSWORD: ${queue_password}
      start: npm run start -w @deck/worker

  # ── worker-dev ──────────────────────────────────────────────
  - setup: worker-dev
    build:
      base: ubuntu/nodejs@22
      buildCommands:
        - npm install
      deployFiles: ./
      cache:
        - node_modules
    run:
      base: ubuntu/nodejs@22
      prepareCommands:
        - sudo apt-get update
        - sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates fonts-liberation fonts-noto
        - curl -fsSL -o /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        - sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends /tmp/chrome.deb
        - rm -f /tmp/chrome.deb
      envVariables:
        NODE_ENV: development
        RENDER_DRIVER: chromium
        CHROMIUM_PATH: /usr/bin/google-chrome-stable
        DATABASE_URL: ${db_connectionString}
        VALKEY_URL: ${cache_connectionString}
        NATS_HOST: ${queue_hostname}
        NATS_PORT: ${queue_port}
        NATS_USER: ${queue_user}
        NATS_PASSWORD: ${queue_password}
