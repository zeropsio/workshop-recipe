# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yaml-json-schema.json
#
# Stage — production setups, one container each, hobby Postgres so the
# rehearsal tier stays cheaper than Small Production.

project:
  name: deck-renderer-stage
  location: us-west-1

services:
  - hostname: frontend
    type: static
    zeropsSetup: frontend
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.25
    # Tells the homepage which environment topology to draw. The Vite build reads it as ${RUNTIME_VITE_WORKSHOP_ENV}, the dev server reads it directly.
    vault:
      VITE_WORKSHOP_ENV: stage

  - hostname: api
    type: ubuntu/nodejs@22
    zeropsSetup: api
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    # Created before frontend so ${api_zeropsSubdomain} is correct when the FE build runs.
    priority: 5
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  - hostname: worker
    type: ubuntu/nodejs@22
    zeropsSetup: worker
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    verticalAutoscaling:
      minRam: 1
      minFreeRamGB: 0.5
      minDisk: 2

  - hostname: db
    type: postgresql:single@17
    profile: oltp-hobby
    priority: 10

  - hostname: cache
    type: valkey:single@7.2
    priority: 10

  - hostname: queue
    type: nats:single@2.12
    priority: 10
