# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yaml-json-schema.json
#
# Local — production setups in Zerops so zCLI VPN can reach db/queue/cache
# and the worker (Chromium) stays on the platform. The SPA and API can
# also run on a laptop against those hostnames.

project:
  name: deck-renderer-local

services:
  - hostname: frontend
    type: static
    zeropsSetup: frontend
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.25

  - hostname: api
    type: ubuntu/nodejs@22
    zeropsSetup: api
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    # Created before the SPA so ${api_zeropsSubdomain}
    # already carries its -3000 port when the SPA builds.
    priority: 5
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  # Worker stays in Zerops — Chromium is a system package, not a laptop
  # dependency. Subscribes to NATS; no public HTTP.
  - hostname: worker
    type: ubuntu/nodejs@22
    zeropsSetup: worker
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    verticalAutoscaling:
      minRam: 1
      minFreeRamGB: 0.5
      minDisk: 2

  - hostname: db
    type: postgresql:single@17
    profile: oltp-hobby
    priority: 10

  - hostname: cache
    type: valkey:single@7.2
    priority: 10

  - hostname: queue
    type: nats:single@2.12
    priority: 10
