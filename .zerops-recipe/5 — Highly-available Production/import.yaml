# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yaml-json-schema.json
#
# HA production — :ha@ data stores require corePackage SERIOUS.
# minContainers: 2 on HTTP apps and the worker. No max ceilings.
# Postgres stays oltp-staging (hello-world HA demo, not oltp-production).

project:
  name: deck-renderer-ha-prod
  location: us-west-1
  corePackage: SERIOUS

services:
  - hostname: frontend
    type: static
    zeropsSetup: frontend
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    minContainers: 2
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.25
    # Tells the homepage which environment topology to draw. The Vite build reads it as ${RUNTIME_VITE_WORKSHOP_ENV}, the dev server reads it directly.
    vault:
      VITE_WORKSHOP_ENV: highly-available-production

  - hostname: api
    type: ubuntu/nodejs@22
    zeropsSetup: api
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    # Created before frontend so ${api_zeropsSubdomain} is correct when the FE build runs.
    priority: 5
    minContainers: 2
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  - hostname: worker
    type: ubuntu/nodejs@22
    zeropsSetup: worker
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    minContainers: 3
    verticalAutoscaling:
      minRam: 1
      minFreeRamGB: 0.5
      minDisk: 2

  - hostname: db
    type: postgresql:ha@17
    profile: oltp-staging
    priority: 10

  - hostname: cache
    type: valkey:ha@7.2
    priority: 10

  - hostname: queue
    type: nats:ha@2.12
    priority: 10
