#zeropsPreprocessor=on

# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yaml-json-schema.json
#
# AI agent env — zcp workspace plus dev/stage pairs for frontend, api, and worker.
# No env vars here: zerops.yaml derives the public URLs from ${hostname_zeropsSubdomain}, so they follow the project's own region.

project:
  name: deck-renderer-agent
  location: us-west-1

services:
  #
  # Dev apps
  #

  - hostname: frontenddev
    type: ubuntu/nodejs@22
    zeropsSetup: frontend-dev
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5
    # Tells the homepage which environment topology to draw. The Vite build reads it as ${RUNTIME_VITE_WORKSHOP_ENV}, the dev server reads it directly.
    vault:
      VITE_WORKSHOP_ENV: ai-agent


  - hostname: apidev
    type: ubuntu/nodejs@22
    zeropsSetup: api-dev
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    # Created before the frontend so ${apidev_zeropsSubdomain} is correct when the FE build runs.
    priority: 5
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  # Chromium is installed via run.prepareCommands and needs the Ubuntu worker-dev setup, not a process-only app container.
  - hostname: workerdev
    type: ubuntu/nodejs@22
    zeropsSetup: worker-dev
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    verticalAutoscaling:
      minRam: 1
      minFreeRamGB: 0.5
      minDisk: 2

  #
  # Stage apps
  #

  - hostname: frontendstage
    type: static
    zeropsSetup: frontend-stage
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.25
    # Tells the homepage which environment topology to draw. The Vite build reads it as ${RUNTIME_VITE_WORKSHOP_ENV}, the dev server reads it directly.
    vault:
      VITE_WORKSHOP_ENV: ai-agent

  - hostname: apistage
    type: ubuntu/nodejs@22
    zeropsSetup: api
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    # Created before frontendstage so ${apistage_zeropsSubdomain} is correct when the FE build runs.
    priority: 5
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  - hostname: workerstage
    type: ubuntu/nodejs@22
    zeropsSetup: worker
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    verticalAutoscaling:
      minRam: 1
      minFreeRamGB: 0.5
      minDisk: 2

  # Priority 10 starts data stores before the API and worker connect.
  - hostname: db
    type: postgresql:single@17
    profile: oltp-hobby
    priority: 10

  - hostname: cache
    type: valkey:single@7.2
    priority: 10

  - hostname: queue
    type: nats:single@2.12
    priority: 10
