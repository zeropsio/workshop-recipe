#zeropsPreprocessor=on

# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yaml-json-schema.json
#
# AI agent env — zcp workspace plus dev/stage pairs for frontend, api,
# and worker. No env vars here: zerops.yaml derives the public URLs from
# ${hostname_zeropsSubdomain}, so they follow the project's own region.

project:
  name: deck-renderer-agent
  location: us-west-1

services:
  # Agent workspace — Browser VS Code + Zerops MCP. App code runs on
  # the frontend/api/worker hostnames, not here.
  - hostname: zcp
    type: zcp@1
    maxContainers: 1
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 2
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    vault:
      VSCODE_PASSWORD: "<@generateRandomString(<32>)>"
      ZCP_VSCODE_AUTH_ENABLED: "true"
      ZCP_VSCODE: "true"
      ZCP_AGENT_AUTH_TYPE_CLAUDE_CODE: "oauth"

  - hostname: frontenddev
    type: ubuntu/nodejs@22
    zeropsSetup: frontend-dev
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5

  - hostname: apidev
    type: ubuntu/nodejs@22
    zeropsSetup: api-dev
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    # Created before the SPA so ${apidev_zeropsSubdomain}
    # already carries its -3000 port when the SPA builds.
    priority: 5
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  # Chromium lives in run.prepareCommands — needs the Ubuntu worker-dev
  # setup, not a process-only app container.
  - hostname: workerdev
    type: ubuntu/nodejs@22
    zeropsSetup: worker-dev
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    verticalAutoscaling:
      minRam: 1
      minFreeRamGB: 0.5
      minDisk: 2

  - hostname: frontend
    type: static
    zeropsSetup: frontend
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.25

  - hostname: api
    type: ubuntu/nodejs@22
    zeropsSetup: api
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    # Created before the SPA so ${api_zeropsSubdomain}
    # already carries its -3000 port when the SPA builds.
    priority: 5
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  - hostname: worker
    type: ubuntu/nodejs@22
    zeropsSetup: worker
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    verticalAutoscaling:
      minRam: 1
      minFreeRamGB: 0.5
      minDisk: 2

  # Priority 10 starts data stores before the API and worker connect.
  - hostname: db
    type: postgresql:single@17
    profile: oltp-hobby
    priority: 10

  - hostname: cache
    type: valkey:single@7.2
    priority: 10

  - hostname: queue
    type: nats:single@2.12
    priority: 10
