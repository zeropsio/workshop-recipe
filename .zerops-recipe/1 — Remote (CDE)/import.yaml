# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yaml-json-schema.json
#
# Remote CDE — same topology as the agent env without zcp. Developers
# SSH into *dev hostnames. Public URLs resolve from
# ${hostname_zeropsSubdomain} in zerops.yaml.

project:
  name: deck-renderer-remote
  location: us-west-1

services:
  - hostname: frontenddev
    type: ubuntu/nodejs@22
    zeropsSetup: frontend-dev
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5

  - hostname: apidev
    type: ubuntu/nodejs@22
    zeropsSetup: api-dev
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    # Created before the SPA so ${apidev_zeropsSubdomain}
    # already carries its -3000 port when the SPA builds.
    priority: 5
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  - hostname: workerdev
    type: ubuntu/nodejs@22
    zeropsSetup: worker-dev
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    verticalAutoscaling:
      minRam: 1
      minFreeRamGB: 0.5
      minDisk: 2

  - hostname: frontend
    type: static
    zeropsSetup: frontend
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.25

  - hostname: api
    type: ubuntu/nodejs@22
    zeropsSetup: api
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    enableSubdomainAccess: true
    # Created before the SPA so ${api_zeropsSubdomain}
    # already carries its -3000 port when the SPA builds.
    priority: 5
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  - hostname: worker
    type: ubuntu/nodejs@22
    zeropsSetup: worker
    buildFromGit: https://github.com/zeropsio/workshop-recipe
    verticalAutoscaling:
      minRam: 1
      minFreeRamGB: 0.5
      minDisk: 2

  - hostname: db
    type: postgresql:single@17
    profile: oltp-hobby
    priority: 10

  - hostname: cache
    type: valkey:single@7.2
    priority: 10

  - hostname: queue
    type: nats:single@2.12
    priority: 10
